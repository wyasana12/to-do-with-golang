            application/json: {}
    put:
      tags:
        - ToDo
      summary: Update ToDo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                title: Test Todo 2
                description: Test Todo Bukan Kaleng-kaleng
